[package]
name = "nju-coding-agent"
version = "0.1.0"
edition = "2024"
description = "A small, framework-free coding agent for the NJU assessment"
license = "MIT"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
